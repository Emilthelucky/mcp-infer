name: Feature request
description: Propose a new type, JSDoc tag, integration, or capability
labels: [enhancement]
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What can't you do today, and why does it matter?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposal
          description: What you'd like mcp-infer to do. Include a code example if you can.
      validations:
          required: true
    - type: textarea
      id: spec
      attributes:
          label: MCP specification reference
          description: Link the relevant MCP specification section, if any.
